<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <title>Ad Skimmer - Options</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h1>Ad Skimmer Settings</h1>

        <!-- GENERAL SECTION -->
        <section id="general-section" class="section">
            <h2>General</h2>
            <div class="setting-item">
                <label for="clickSkipInterval">
                    Skip Button Click Interval (ms):
                    <span class="helper-text">Minimum time between skip attempts. Lower = faster but may cause issues.</span>
                </label>
                <input type="number" id="clickSkipInterval" min="100" max="2000" step="50" value="500">
                <span class="value-display" id="clickSkipIntervalDisplay">500ms</span>
            </div>

            <div class="setting-item">
                <label for="adSkipTimeOffset">
                    Ad Skip Time Offset (seconds):
                    <span class="helper-text">How close to the end of the ad to skip (minimum 0.1s). Lower values skip earlier.</span>
                </label>
                <input type="number" id="adSkipTimeOffset" min="0.1" max="5" step="0.1" value="0.1">
                <span class="value-display" id="adSkipTimeOffsetDisplay">0.1s</span>
            </div>

            <div class="setting-item">
                <label for="enableExtension">
                    <input type="checkbox" id="enableExtension" checked>
                    Enable Ad Skimmer
                </label>
            </div>
        </section>

        <!-- SITE RULES SECTION -->
        <section id="sites-section" class="section">
            <h2>Site Rules</h2>
            <p class="section-info">Configure which sites the extension works on and how to detect ads.</p>
            
            <div class="site-rules-controls">
                <button id="addSiteBtn" class="btn btn-primary">+ Add New Site Rule</button>
                
                <!-- Export Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle">📥 Export</button>
                    <div class="dropdown-menu">
                        <button id="exportRulesBtn" class="dropdown-item">Export All to File</button>
                        <button id="exportClipboardBtn" class="dropdown-item">Copy All to Clipboard</button>
                    </div>
                </div>

                <!-- Import Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle">📤 Import</button>
                    <div class="dropdown-menu">
                        <button id="importRulesBtn" class="dropdown-item">Import from File</button>
                        <button id="importClipboardBtn" class="dropdown-item">Paste from Clipboard</button>
                    </div>
                </div>

                <button id="resetDefaultsBtn" class="btn btn-secondary">Reset to Defaults</button>
                
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>

            <div id="siteRulesList" class="site-rules-list">
                <!-- Rules will be dynamically added here -->
            </div>
        </section>

        <!-- FOOTER -->
        <section class="section footer-section">
            <button id="saveBtn" class="btn btn-success">Save Settings</button>
            <button id="resetBtn" class="btn btn-secondary">Reset to Defaults</button>
            <span id="status" class="status-message"></span>
        </section>
    </div>

    <script src="options.js"></script>
</body>
</html>
